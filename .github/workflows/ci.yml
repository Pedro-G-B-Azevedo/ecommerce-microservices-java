name: CI

on:
  push:
    branches: [main, 'claude/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # Os testes usam Testcontainers; o runner do GitHub já expõe o Docker daemon.
      - name: Build and run tests
        run: ./mvnw -B --no-transfer-progress verify

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            **/target/surefire-reports/*.xml
            **/target/site/jacoco/**
          if-no-files-found: ignore
          retention-days: 7

  images:
    name: Build container images
    runs-on: ubuntu-latest
    needs: build

    strategy:
      fail-fast: false
      matrix:
        service: [auth-service, orders-service, inventory-service, notification-service]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      # O contexto é a raiz do repositório: é um projeto Maven multi-módulo, e cada
      # serviço depende do POM pai e do módulo contracts.
      - name: Build ${{ matrix.service }}
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.service }}/Dockerfile
          push: false
          load: true
          tags: ecommerce/${{ matrix.service }}:ci
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      - name: Inspect the image
        run: |
          docker image inspect ecommerce/${{ matrix.service }}:ci \
            --format 'tamanho={{.Size}} usuario={{.Config.User}} camadas={{len .RootFS.Layers}}'
          # A imagem não pode rodar como root.
          test "$(docker image inspect ecommerce/${{ matrix.service }}:ci --format '{{.Config.User}}')" = "spring:spring"

  e2e:
    name: End-to-end journey
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # Sobe exatamente a mesma pilha que um desenvolvedor sobe na própria máquina:
      # as quatro imagens, seus bancos e o Kafka.
      - name: Start the stack
        run: docker compose up -d --build --wait --wait-timeout 600

      - name: Run the end-to-end journey
        run: ./mvnw -B --no-transfer-progress -pl e2e-tests verify -Dskip.e2e=false

      - name: Collect service logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 200

      - name: Tear down
        if: always()
        run: docker compose down -v
