# Ambiente local completo: um banco por serviço, o broker Kafka, os quatro
# serviços e o front-end React.
#
#   docker compose up -d --build
#
# Para subir apenas a infraestrutura e rodar os serviços pela IDE:
#
#   docker compose up -d auth-db orders-db inventory-db notification-db kafka
name: ecommerce

services:
  auth-db:
    image: postgres:16-alpine
    container_name: ecommerce-auth-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: auth
      POSTGRES_USER: ${AUTH_DB_USER:-auth}
      POSTGRES_PASSWORD: ${AUTH_DB_PASSWORD:-auth}
    ports:
      - "5433:5432"
    volumes:
      - auth-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${AUTH_DB_USER:-auth} -d auth"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - ecommerce

  orders-db:
    image: postgres:16-alpine
    container_name: ecommerce-orders-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: orders
      POSTGRES_USER: ${ORDERS_DB_USER:-orders}
      POSTGRES_PASSWORD: ${ORDERS_DB_PASSWORD:-orders}
    ports:
      - "5434:5432"
    volumes:
      - orders-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${ORDERS_DB_USER:-orders} -d orders"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - ecommerce

  inventory-db:
    image: postgres:16-alpine
    container_name: ecommerce-inventory-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: inventory
      POSTGRES_USER: ${INVENTORY_DB_USER:-inventory}
      POSTGRES_PASSWORD: ${INVENTORY_DB_PASSWORD:-inventory}
    ports:
      - "5435:5432"
    volumes:
      - inventory-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${INVENTORY_DB_USER:-inventory} -d inventory"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - ecommerce

  notification-db:
    image: postgres:16-alpine
    container_name: ecommerce-notification-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: notification
      POSTGRES_USER: ${NOTIFICATION_DB_USER:-notification}
      POSTGRES_PASSWORD: ${NOTIFICATION_DB_PASSWORD:-notification}
    ports:
      - "5436:5432"
    volumes:
      - notification-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${NOTIFICATION_DB_USER:-notification} -d notification"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - ecommerce

  # Kafka em modo KRaft: o Zookeeper foi removido no Kafka 4.0, então um projeto
  # novo não tem motivo para carregá-lo. O mesmo container acumula os papéis de
  # broker e controller, o que basta para desenvolvimento local.
  kafka:
    image: apache/kafka:4.1.0
    container_name: ecommerce-kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:29092,CONTROLLER://:9093,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      # Fator de replicação 1 porque há um único broker; em produção seria 3.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      CLUSTER_ID: ecommerce-local-cluster
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s
    networks:
      - ecommerce

  auth-service:
    build:
      context: .
      dockerfile: auth-service/Dockerfile
    container_name: ecommerce-auth-service
    restart: unless-stopped
    depends_on:
      auth-db:
        condition: service_healthy
    ports:
      - "8081:8081"
    environment:
      AUTH_DB_URL: jdbc:postgresql://auth-db:5432/auth
      AUTH_DB_USER: ${AUTH_DB_USER:-auth}
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD:-auth}
      AUTH_ADMIN_EMAIL: ${AUTH_ADMIN_EMAIL:-admin@ecommerce.local}
      AUTH_ADMIN_PASSWORD: ${AUTH_ADMIN_PASSWORD:-troque-esta-senha-admin}
      AUTH_SERVICE_ACCOUNT_EMAIL: ${AUTH_SERVICE_ACCOUNT_EMAIL:-orders-service@ecommerce.local}
      AUTH_SERVICE_ACCOUNT_PASSWORD: ${AUTH_SERVICE_ACCOUNT_PASSWORD:-troque-esta-senha-servico}
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY:-}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8081/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    networks:
      - ecommerce

  inventory-service:
    build:
      context: .
      dockerfile: inventory-service/Dockerfile
    container_name: ecommerce-inventory-service
    restart: unless-stopped
    depends_on:
      inventory-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
      # Espera o auth-service porque precisa da chave pública para validar tokens.
      auth-service:
        condition: service_healthy
    ports:
      - "8083:8083"
    environment:
      INVENTORY_DB_URL: jdbc:postgresql://inventory-db:5432/inventory
      INVENTORY_DB_USER: ${INVENTORY_DB_USER:-inventory}
      INVENTORY_DB_PASSWORD: ${INVENTORY_DB_PASSWORD:-inventory}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      JWT_JWK_SET_URI: http://auth-service:8081/.well-known/jwks.json
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8083/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    networks:
      - ecommerce

  orders-service:
    build:
      context: .
      dockerfile: orders-service/Dockerfile
    container_name: ecommerce-orders-service
    restart: unless-stopped
    depends_on:
      orders-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      inventory-service:
        condition: service_healthy
    ports:
      - "8082:8082"
    environment:
      ORDERS_DB_URL: jdbc:postgresql://orders-db:5432/orders
      ORDERS_DB_USER: ${ORDERS_DB_USER:-orders}
      ORDERS_DB_PASSWORD: ${ORDERS_DB_PASSWORD:-orders}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      JWT_JWK_SET_URI: http://auth-service:8081/.well-known/jwks.json
      INVENTORY_BASE_URL: http://inventory-service:8083
      AUTH_BASE_URL: http://auth-service:8081
      SERVICE_ACCOUNT_EMAIL: ${SERVICE_ACCOUNT_EMAIL:-orders-service@ecommerce.local}
      SERVICE_ACCOUNT_PASSWORD: ${SERVICE_ACCOUNT_PASSWORD:-troque-esta-senha-servico}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8082/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    networks:
      - ecommerce

  notification-service:
    build:
      context: .
      dockerfile: notification-service/Dockerfile
    container_name: ecommerce-notification-service
    restart: unless-stopped
    depends_on:
      notification-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
      auth-service:
        condition: service_healthy
    ports:
      - "8084:8084"
    environment:
      NOTIFICATION_DB_URL: jdbc:postgresql://notification-db:5432/notification
      NOTIFICATION_DB_USER: ${NOTIFICATION_DB_USER:-notification}
      NOTIFICATION_DB_PASSWORD: ${NOTIFICATION_DB_PASSWORD:-notification}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      JWT_JWK_SET_URI: http://auth-service:8081/.well-known/jwks.json
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8084/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    networks:
      - ecommerce

  frontend:
    build:
      context: frontend
      dockerfile: Dockerfile
      args:
        # O navegador de quem acessa fala com cada serviço nestas portas
        # publicadas aqui embaixo, não com os nomes internos da rede Docker.
        VITE_AUTH_URL: ${VITE_AUTH_URL:-http://localhost:8081}
        VITE_ORDERS_URL: ${VITE_ORDERS_URL:-http://localhost:8082}
        VITE_INVENTORY_URL: ${VITE_INVENTORY_URL:-http://localhost:8083}
        VITE_NOTIFICATIONS_URL: ${VITE_NOTIFICATIONS_URL:-http://localhost:8084}
    container_name: ecommerce-frontend
    restart: unless-stopped
    ports:
      - "5173:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8080/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - ecommerce

volumes:
  auth-db-data:
  orders-db-data:
  inventory-db-data:
  notification-db-data:
  kafka-data:

networks:
  ecommerce:
    driver: bridge
