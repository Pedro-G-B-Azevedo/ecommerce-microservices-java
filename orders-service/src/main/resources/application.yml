server:
  port: 8082

spring:
  application:
    name: orders-service
  datasource:
    url: ${ORDERS_DB_URL:jdbc:postgresql://localhost:5434/orders}
    username: ${ORDERS_DB_USER:orders}
    password: ${ORDERS_DB_PASSWORD:orders}
  jpa:
    open-in-view: false
    hibernate:
      # O schema é responsabilidade exclusiva do Flyway; o Hibernate apenas valida.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
  api-docs:
    path: /v3/api-docs

logging:
  level:
    com.ecommerce: DEBUG
