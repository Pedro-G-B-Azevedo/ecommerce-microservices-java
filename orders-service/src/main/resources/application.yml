server:
  port: 8082

spring:
  application:
    name: orders-service
  datasource:
    url: ${ORDERS_DB_URL:jdbc:postgresql://localhost:5434/orders}
    username: ${ORDERS_DB_USER:orders}
    password: ${ORDERS_DB_PASSWORD:orders}
  jpa:
    open-in-view: false
    hibernate:
      # O schema é responsabilidade exclusiva do Flyway; o Hibernate apenas valida.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: orders-service
      auto-offset-reset: earliest
      # Confirmação manual dos offsets pelo container: o offset só avança depois
      # que o listener termina sem erro, o que preserva a semântica at-least-once.
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: com.ecommerce.contracts
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      # Sem perda de mensagem em troca de líder: espera todas as réplicas in-sync.
      acks: all
      retries: 3
      properties:
        enable.idempotence: true
    listener:
      ack-mode: record
      observation-enabled: false
  security:
    oauth2:
      resourceserver:
        jwt:
          # A chave pública é buscada no auth-service. Nenhum serviço além dele
          # conhece a privada, então nenhum outro consegue emitir tokens.
          jwk-set-uri: ${JWT_JWK_SET_URI:http://localhost:8081/.well-known/jwks.json}
          issuer-uri: ${JWT_ISSUER:https://auth.ecommerce.local}



management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
  api-docs:
    path: /v3/api-docs

logging:
  level:
    com.ecommerce: DEBUG

inventory:
  base-url: ${INVENTORY_BASE_URL:http://localhost:8083}
  # Curtos de propósito: a criação de pedido é síncrona e não pode ficar pendurada.
  connect-timeout: 2s
  read-timeout: 3s
service-account:
  auth-base-url: ${AUTH_BASE_URL:http://localhost:8081}
  email: ${SERVICE_ACCOUNT_EMAIL:orders-service@ecommerce.local}
  password: ${SERVICE_ACCOUNT_PASSWORD:troque-esta-senha-servico}
