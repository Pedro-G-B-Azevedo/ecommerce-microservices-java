server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA: qualquer rota que não seja um arquivo existente cai no index.html,
    # e o React Router decide o que renderizar a partir da URL.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
