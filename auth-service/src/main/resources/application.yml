server:
  # ${PORT} é injetada por plataformas como o Render, que escolhem a porta em
  # tempo de execução; localmente e no docker-compose ela não existe, e a
  # aplicação cai no padrão de sempre.
  port: ${PORT:8081}

spring:
  application:
    name: auth-service
  datasource:
    url: ${AUTH_DB_URL:jdbc:postgresql://localhost:5433/auth}
    username: ${AUTH_DB_USER:auth}
    password: ${AUTH_DB_PASSWORD:auth}
  jpa:
    open-in-view: false
    hibernate:
      # O schema é responsabilidade exclusiva do Flyway; o Hibernate apenas valida.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
  api-docs:
    path: /v3/api-docs

logging:
  level:
    com.ecommerce: DEBUG

jwt:
  issuer: ${JWT_ISSUER:https://auth.ecommerce.local}
  access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:1h}
  # Em PEM (conteúdo entre os marcadores BEGIN/END). Sem elas, um par efêmero é
  # gerado ao subir — só serve para desenvolvimento.
  private-key: ${JWT_PRIVATE_KEY:}
  public-key: ${JWT_PUBLIC_KEY:}

auth:
  bootstrap:
    # Contas criadas na primeira subida, se configuradas. Os valores padrão existem
    # para que o docker-compose funcione de imediato; troque-os fora de desenvolvimento.
    admin:
      email: ${AUTH_ADMIN_EMAIL:admin@ecommerce.local}
      password: ${AUTH_ADMIN_PASSWORD:troque-esta-senha-admin}
      full-name: Administrador
    service-account:
      email: ${AUTH_SERVICE_ACCOUNT_EMAIL:orders-service@ecommerce.local}
      password: ${AUTH_SERVICE_ACCOUNT_PASSWORD:troque-esta-senha-servico}
      full-name: orders-service

app:
  cors:
    # Origem do front-end React; várias origens separadas por vírgula.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
